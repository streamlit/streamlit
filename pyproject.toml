# =============================================================================
# Root pyproject.toml - Development environment configuration
# =============================================================================
# This file defines:
# - Tool configurations (ruff, mypy, ty)
# - Development dependency groups
#
# The streamlit package itself is defined in lib/pyproject.toml.
# Test-specific configs are in lib/pyproject.toml and e2e_playwright/pytest.ini.
# =============================================================================

[project]
name = "streamlit-dev"
version = "0.0.0"
description = "Development environment for Streamlit"
requires-python = ">=3.10"
# Empty dependencies - the actual package is installed via [tool.uv.sources]
dependencies = []

[tool.uv]
# Minimum uv version required for this project
required-version = ">=0.9.17"
# Exclude packages published in the last 24 hours to lower risk from supply chain attacks
exclude-newer = "24 hours"
# Explicit pandas version constraints by Python version:
# - Python 3.10: use pandas 2.x (pandas 3.x requires Python >= 3.11)
# - Python 3.11+: use pandas 3.x
override-dependencies = [
  "pandas>=1.4.0,<3; python_version < '3.11'",
  "pandas>=3.0.0,<4; python_version >= '3.11'",
]

[tool.uv.sources]
streamlit = { path = "lib", editable = true }

# =============================================================================
# Dependency Groups (PEP 735)
# =============================================================================

[dependency-groups]
# Development dependencies - includes test group
dev = [
  { include-group = "test" },
  "streamlit",
  "pre-commit",
  # We fix ty to a version since its still in beta and likely breaks our CI on updates:
  "ty==0.0.56",
  # We fix ruff to a version to be in sync with the pre-commit hook:
  "ruff==0.15.22",
  # We fix mypy to a version to avoid breaking our CI on updates,
  # and have dependabot handle the updates instead.
  "mypy==2.2.0",
  # NumPy 2.5 stubs use Python 3.12 syntax that mypy cannot parse while
  # Streamlit still type-checks as Python 3.10.
  "numpy<2.5",
  "mypy-protobuf>=3.2",
  "semver>=3",
  "setuptools>=65.5.1",
  "build",
  "twine",
  "wheel",
  "pytz",
  # Used for updating emojis via: scripts/update_emojis.py
  "emoji",
  # mypy type stubs
  "types-protobuf",
  "types-pytz",
  "types-requests",
  "types-setuptools",
  "types-toml",
  "types-Authlib",
  # pandas-stubs have caused a couple of CI breaks, so we pin to a specific version.
  # We need to pin 2.3.3.260113 since higher versions require a min Python 3.11 support.
  "pandas-stubs==2.3.3.260113",
]

# Test dependencies
test = [
  "streamlit",
  # Testing infrastructure dependencies:
  # pytest >= 9.1.0 is causing issues and is not yet supported.
  "pytest>=9.0.3,<9.1.0",
  "pytest-cov",
  "hypothesis>=6.17.4",
  "parameterized",
  "requests-mock",
  "testfixtures",
  # tomli is the backport of tomllib for Python <3.11:
  "tomli>=2.0.0; python_version < '3.11'",
  # Packages used to test things users may do with Streamlit:
  "Authlib>=1.3.2",
  "graphviz>=0.17",
  "matplotlib>=3.3.4",
  "plotly>=5.3.1",
  "seaborn>=0.11.2",
  "watchdog>=2.1.5",
  "streamlit-pdf>=1.0.0",
  # Optional dependency for better performance:
  "uvloop>=0.15.2; sys_platform != 'win32'",
  # Optional dependency used for improved exception formatting:
  "rich>=10.14.0",
  # Used by vega-lite / altair e2e tests:
  "vega_datasets",
  # Only for unit tests:
  # httpx2 is used by starlette's TestClient (>=1.2); httpx is still required
  # by authlib's httpx_client integration used in the auth route tests.
  "httpx>=0.24.1",
  "httpx2>=2.7.0",
  # Playwright and E2E test dependencies:
  # We pin playwright to a minor version to avoid new browser versions breaking our CI.
  "playwright==1.61.*",
  "pytest-playwright>=0.3.3",
  "pixelmatch>=0.3.0",
  "pytest-xdist>=3.6.1",
  # pytest-rerunfailures 16.0 is breaking our CI:
  # https://github.com/pytest-dev/pytest-rerunfailures/issues/302
  "pytest-rerunfailures>=15.0,!=16.0",
  # pytest-github-actions-annotate-failures 0.4 has compatibility issues:
  "pytest-github-actions-annotate-failures>=0.3.0,<0.4.0",
  "pytest-benchmark>=5.1.0",
  "pytest-repeat>=0.9.3",
  "pytest-timeout>=2.3.1",
  # Used for memory tracking in E2E test statistics:
  "psutil>=5.9.0",
  "types-psutil>=5.9.0",
]

# Integration test dependencies
integration = [
  { include-group = "test" },
  "streamlit",
  # Snowflake dependencies:
  "snowflake-snowpark-python[modin]>=1.17.0",
  "snowflake-connector-python>=3.3.0",
  # Additional dataframe formats for testing:
  "polars",
  "xarray",
  "dask",
  "duckdb",
  # Used for testing of st.connection:
  "sqlalchemy[mypy]>=2.0.0",
  # Used by audio test:
  "scipy>=1.7.3",
  # Used to ensure pydantic is supported:
  "pydantic>=2.0.0",
  # Used by type_util tests:
  "sympy",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
  # Autogenerated files:
  "lib/streamlit/proto",
  "lib/streamlit/emojis.py",
  "lib/streamlit/material_icon_names.py",
  # File with an expected compilation error:
  "e2e_playwright/compilation_error_dialog.py",
  # Ignore frontend directory:
  "frontend/**",
]
exclude = [
  # pympler is a vendored dependency that doesn't conform to our linting rules:
  "lib/streamlit/vendor/**",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"

[tool.ruff.lint]
preview = true
explicit-preview-rules = false
# We activate all rules and only ignore the rules that we don't want to enforce
# or that are not relevant for our codebase.
select = ["ALL"]
ignore = [
  # Rules planned to be supported in the future:
  "raw-string-in-exception",  # Checks for the use of string literals in exception constructors.
  "f-string-in-exception",  # Checks for the use of f-strings in exception constructors.
  "raise-vanilla-args", # Checks for exception messages that are not defined in the exception class itself.
  # Ignored rule sets:
  "DTZ", # Checks for usage of unsafe naive datetime class.
  "PTH", # Enforces usage of pathlib.
  "C90", # Checks for McCabe complexity.
  "FBT", # Forbids boolean positional arguments.
  "SLF", # Checks unexpected for private member access.
  "BLE", # Checks for blind except statements.
  "CPY", # Checks for copyright statement.
  # DOC rules for enforcing docstring completeness (too noisy):
  "docstring-missing-returns", # Checks for missing return documentation.
  "docstring-missing-yields", # Checks for missing yield documentation.
  "docstring-missing-exception", # Checks for missing exception documentation.
  "docstring-extraneous-exception", # Checks for extraneous exception documentation.
  # Ignored rules:
  "builtin-argument-shadowing",    # Checks if function argument shadows a Python builtin.
  "any-type",  # Checks that `any` is not used as an annotation.
  "raise-without-from-inside-except",    # Checks for raise statements in exception handlers that lack a from clause.
  "missing-trailing-comma",  # Checks for absence of trailing commas. Not recommended with formatter.
  "prohibited-trailing-comma",  # Checks for presence of prohibited trailing commas. Not recommended with formatter.
  "undocumented-public-module",    # Checks for missing docstring in public module.
  "undocumented-public-class",    # Checks for missing docstring in public class.
  "undocumented-public-method",    # Checks for missing docstring in public method.
  "undocumented-public-function",    # Checks for missing docstring in public function.
  "undocumented-public-package",    # Checks for missing docstring in public package.
  "undocumented-magic-method",    # Checks for missing docstring in magic method.
  "undocumented-public-nested-class",    # Checks for missing docstring in public nested class.
  "undocumented-public-init",    # Checks for missing docstring in __init__.
  "blank-line-after-function",    # Checks for no-blank line after docstring.
  "missing-blank-line-after-summary",    # Checks for missing blank line after docstring summary.
  "non-imperative-mood",    # Checks for docstring to start with imperative mood.
  "multiple-leading-hashes-for-block-comment",    # Checks for multiple leading hashes in block comments.
  "line-contains-todo",  # Checks todo comments (which we want to allow).
  "read-whole-file", # Checks for open and read calls that can be replaced by pathlib.
  "write-whole-file", # Checks for open and write calls that can be replaced by pathlib.
  "repeated-append", # Checks for repeated append calls that can be replaced by extend.
  "math-constant", # Checks for math constants that could use math module.
  "pandas-use-of-dot-iat",   # Checks for usage of pd.DataFrame.iat.
  "blanket-type-ignore",  # Checks for blanket type ignore.
  "import-outside-top-level", # Enforces imports to be at the top-level of the file.
  "compare-to-empty-string", # Checks for comparisons to empty string.
  "import-private-name", # Checks for imports of private names.
  "too-many-public-methods", # Checks for classes with too many public methods.
  "too-many-return-statements", # Checks for functions with too many return statements.
  "too-many-branches", # Checks for functions with too many branches.
  "too-many-arguments", # Checks for functions with too many arguments.
  "too-many-locals", # Checks for functions with too many local variables.
  "too-many-statements", # Checks for functions with too many statements.
  "too-many-boolean-expressions", # Checks for too many boolean expressions in if statements.
  "too-many-positional-arguments", # Checks for functions with too many positional arguments.
  "too-many-nested-blocks", # Checks for functions with too many nested blocks.
  "magic-value-comparison", # Checks for numerical values that could be put into a constant.
  "no-self-use", # Checks for methods that do not use self.
  "unnecessary-lambda", # Checks for lambdas that can be replaced by existing functions.
  "too-many-statements-in-try-clause", # Checks for try clauses with too many statements (new in ruff 0.15.14).
  "bad-dunder-method-name", # Checks for bad dunder method names.
  "pytest-raises-with-multiple-statements",   # Checks for pytest.raises context managers with multiple statements.
  "pytest-fixture-param-without-value",   # Checks for tests that should use @pytest.mark.usefixtures (incompatible with unittest.patch)
  "redundant-numeric-union",  # Checks for parameter annotations that contain redundant unions between builtin numeric types (e.g., int | float).
  "redundant-literal-union",  # Checks for redundant unions between a Literal and a builtin supertype of that Literal.
  "unnecessary-assign",  # Checks for assignments that immediately precede a return of the assigned variable (too opinionated).
  "unnecessary-paren-on-raise-exception",  # Checks for unnecessary parentheses on raised exceptions.
  "used-dummy-variable",  # Checks for dummy variables that are used.
  "non-empty-init-module",  # Checks for non empty __init__ modules.
  "fallible-context-manager",  # Checks for context managers that don't catch exceptions (new preview rule in ruff 0.15.14).
  "pytest-fixture-autouse",  # Checks for autouse=True in pytest.fixture decorators (new rule in ruff 0.15.17; autouse is intentional in our fixtures).
  "suppressible-exception",  # Enforces use of contextlib.suppress.
  "if-else-block-instead-of-if-exp",  # Enforces ternary operators instead of if-else.
  "open-file-with-context-handler",  # Enforces context manager for opening files.
  "multiple-with-statements",  # Enforces single with statement with multiple contexts.
  "split-static-string",  # Enforces list instead of st.split.
  "missing-todo-author",   # Checks for missing author in TODO comment.
  "missing-todo-link",   # Checks for missing issue link in TODO comment.
  "try-consider-else",  # Checks for return statements in try blocks.
]
extend-safe-fixes = ["typing-only-third-party-import", "typing-only-standard-library-import"]

[tool.ruff.lint.per-file-ignores]
# Only add ignores for entire folders here. To ignore rules in individual
# files, use the noqa ignore comment on top of the given file.
"e2e_playwright/**" = [
  "useless-expression",   # Allow useless expressions (e.g., for side effects in tests).
  "DOC",    # Ignore docstring correctness rules.
  "invalid-module-name",   # Allow invalid module names (test files use descriptive names).
  "numpy-legacy-random", # Allow legacy numpy random generation.
  "PD",     # Ignore pandas-vet rules (test data manipulation patterns).
  "PERF",   # Ignore performance rules (clarity over speed in tests).
  "unused-async", # Allow async functions without await (intentional for testing async behavior).
  "S",      # Ignore bandit security rules (test code doesn't need security hardening).
  "T20",    # Allow print statements (useful for test debugging).
  "TRY",    # Ignore tryceratops rules (simpler exception handling in tests).
]
"lib/tests/**" = [
  "ANN",     # Ignore annotation rules (test functions don't need full typing).
  "ARG",     # Allow unused arguments (common in test fixtures and mocks).
  "D",       # Ignore docstring rules.
  "DOC",     # Ignore docstring correctness rules.
  "reimplemented-operator", # Allow all operators (tests may use operator module intentionally).
  "subclass-builtin", # Allow subclassing of builtin types (for test mocking).
  "INP",     # Allow implicit namespace packages (test directories).
  "N",       # Ignore naming conventions (test names can be descriptive/long).
  "numpy-legacy-random",  # Allow legacy numpy random generation.
  "PD",      # Ignore pandas-vet rules (test data manipulation patterns).
  "PERF",    # Ignore performance rules (clarity over speed in tests).
  "unnecessary-dunder-call", # Allow dunder calls (e.g., object.__setattr__ for frozen dataclasses).
  "unused-async",  # Allow async functions without await (test fixtures, mocks, ASGI callables).
  "float-equality-comparison",  # Allow float equality checks in test assertions.
  "S",       # Ignore bandit security rules (test code doesn't need security hardening).
  "TRY",     # Ignore tryceratops rules (simpler exception handling in tests).
]
"scripts/**" = ["T20", "INP", "PERF", "S", "raise-vanilla-class"]
"lib/streamlit/.agents/**" = [
  # Each template is a standalone app, not a package. Adding __init__.py would
  # misrepresent them as importable modules.
  "INP",
]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["streamlit", "shared", "tests", "e2e_playwright"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.pycodestyle]
# Allow lines (e.g. comments) up to 120 characters instead of 88,
# which works well with Github.
max-line-length = 120

[tool.ruff.lint.flake8-comprehensions]
# Allow dict calls that make use of keyword arguments (e.g., dict(a=1, b=2)).
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-unused-arguments]
# Ignore unused variadic argument, like *args and **kwargs.
ignore-variadic-names = true

[tool.ruff.lint.flake8-annotations]
# Allow missing return annotation on functions that return None:
suppress-none-returning = true

# =============================================================================
# Mypy Configuration
# =============================================================================

[tool.mypy]
python_version = "3.10"
cache_dir = ".mypy_cache"
incremental = true
files = [
  "lib/streamlit/",
  "lib/tests/streamlit/typing/",
  "scripts/",
  "e2e_playwright/",
]
exclude = [
  # The compilation error test file breaks mypy because of the syntax error.
  "^e2e_playwright/compilation_error_dialog\\.py$",
]

# Strict mode settings:
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Other settings:
allow_redefinition = false
no_implicit_optional = true
strict_optional = true
warn_unreachable = true
warn_no_return = true
scripts_are_modules = true
namespace_packages = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "e2e_playwright.*"
# We don't want to enforce return types for test functions
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
# Ignore all errors in unit tests
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.streamlit.typing.*"
# Explicitly enable type checking for the typing tests
ignore_errors = false

[[tool.mypy.overrides]]
module = [
  "shared.*",
  "vega_datasets.*",
  "sympy.*",
  "plotly.*",
  "pydeck.*",
  "pyarrow.*",
  "graphviz.*",
  "authlib.*",
  "uvloop.*",
  "polars.*",
  # yfinance is a template-only dependency (used by dashboard-stock-peers) and has no stubs.
  "yfinance.*",
  # SQLAlchemy is optional and its stubs are only installed with integration extras
  "sqlalchemy.*",
  # tomllib is only available in Python 3.11+, tomli is the fallback for Python 3.10
  "tomllib",
  "tomli",
]
ignore_missing_imports = true

# =============================================================================
# ty Configuration
# =============================================================================

[tool.ty.environment]
root = ["./lib/streamlit"]

[tool.ty.src]
include = ["lib/streamlit", "e2e_playwright", "scripts"]
exclude = [
  "e2e_playwright/compilation_error_dialog.py",
  "lib/streamlit/vendor/**",
]

[tool.ty.rules]
unresolved-import = "ignore"
possibly-unresolved-reference = "error"
unused-type-ignore-comment = "ignore"
