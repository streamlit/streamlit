[project]
name = "streamlit-mcp"
version = "0.1.0"
description = "MCP adapter over Streamlit's loopback agent JSON endpoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28,<2",
  "matplotlib",
  "fonttools",
  "brotli",
]

[project.scripts]
streamlit-mcp = "streamlit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
