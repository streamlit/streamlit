name: Python Bare Execution Tests

on:
  push:
    branches:
      - "develop"
  pull_request:
    types: [opened, synchronize, reopened]

  # Allows workflow to be called from other workflows
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

# Avoid duplicate workflows on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-bare-executions
  cancel-in-progress: true

jobs:
  py-bare-executions:
    # Skip if PR is labeled with 'change:spec' (spec-only changes don't need these tests)
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'change:spec')
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Streamlit code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 2
      - name: Set Python version vars
        uses: ./.github/actions/build_info
      - name: Set up Python ${{ env.PYTHON_MAX_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_MAX_VERSION }}"
      - name: Setup virtual env
        uses: ./.github/actions/make_init
      - name: Run Bare Execution Tests
        run: make bare-execution-tests

  # Gate job for branch protection - reports success if tests passed or were skipped
  py-bare-executions-status:
    if: always()
    needs: [py-bare-executions]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.py-bare-executions.result }}" =~ ^(success|skipped)$ ]]; then
            echo "Tests passed or were skipped"
            exit 0
          else
            echo "Tests failed"
            exit 1
          fi
