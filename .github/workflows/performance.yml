name: Performance Suite

on:
  push:
    branches:
      - "develop"

  # Allows workflow to be called from other workflows
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

# Avoid duplicate workflows on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-performance
  cancel-in-progress: true

jobs:
  prepare:
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.compute.outputs.checkout_ref }}
      sha_short: ${{ steps.compute.outputs.sha_short }}
    steps:
      - name: Compute checkout inputs
        id: compute
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$INPUT_REF" ]]; then
            echo "checkout_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          fi

          echo "sha_short=${EVENT_SHA:0:6}" >> "$GITHUB_OUTPUT"

  performance:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 25
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Streamlit code
        if: needs.prepare.outputs.checkout_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 2
      - name: Checkout Streamlit code
        if: needs.prepare.outputs.checkout_ref == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 2
      - name: Set Python version vars
        uses: ./.github/actions/build_info
      - name: Setup virtual env
        uses: ./.github/actions/make_init
        with:
          python_version: ${{ env.PYTHON_MAX_VERSION }}
      - name: Install playwright
        uses: ./.github/actions/playwright_install
      - name: Install integration dependencies
        run: uv pip install polars
      - name: Run make frontend-with-profiler
        run: make frontend-with-profiler
      - name: Run playwright performance tests
        run: |
          cd e2e_playwright
          rm -rf ./test-results
          pytest --browser chromium -n 1 --reruns 1 -m "performance and not bi_performance" --count=10
      - name: Run make python-performance-tests
        run: make python-performance-tests
      - name: Run make lighthouse-tests
        run: make lighthouse-tests
      - name: Set MY_DATE_TIME env var
        run: echo "MY_DATE_TIME=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - name: Upload failed test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright_test_results_${{ needs.prepare.outputs.sha_short }}
          path: e2e_playwright/test-results
      - name: Upload Performance results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance_results_${{ env.MY_DATE_TIME }}
          include-hidden-files: true
          path: .benchmarks
