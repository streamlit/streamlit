name: CLI Regression

on:
  push:
    branches:
      - "develop"
  pull_request:
    types: [opened, synchronize, reopened]

# Avoid duplicate workflows on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-regression:
    # Skip if PR is labeled with 'change:spec' (spec-only changes don't need these tests)
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'change:spec')
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Streamlit code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 2
      - name: Set Python version vars
        uses: ./.github/actions/build_info
      - name: Set up Python ${{ env.PYTHON_MAX_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_MAX_VERSION }}"
      - name: Setup virtual env
        uses: ./.github/actions/make_init
      - name: Build Package - Fast
        timeout-minutes: 120
        run: |
          sudo apt install rsync
          make package
      - name: Install streamlit in production mode
        run: |
          pip install -U ./lib
      - name: Run CLI regression tests
        run: |
          export SKIP_VERSION_CHECK=true; pytest scripts/cli_regression_tests.py

  # Gate job for branch protection - reports success if tests passed or were skipped
  cli-regression-status:
    if: always()
    needs: [cli-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.cli-regression.result }}" =~ ^(success|skipped)$ ]]; then
            echo "Tests passed or were skipped"
            exit 0
          else
            echo "Tests failed"
            exit 1
          fi
