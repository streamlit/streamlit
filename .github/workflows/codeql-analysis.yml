name: "CodeQL"

on:
  push:
    branches: ["develop"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["develop"]
  schedule:
    - cron: "22 19 * * 6"

jobs:
  codeql-analysis:
    # Skip if PR is labeled with 'change:spec' (spec-only changes don't need these checks)
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'change:spec')
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "python"]

    steps:
      - name: Checkout Streamlit code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: "recursive"
          fetch-depth: 2
      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # Gate job for branch protection - reports success if analysis passed or was skipped
  codeql-status:
    if: always()
    needs: [codeql-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Check analysis results
        run: |
          if [[ "${{ needs.codeql-analysis.result }}" =~ ^(success|skipped)$ ]]; then
            echo "Analysis passed or was skipped"
            exit 0
          else
            echo "Analysis failed"
            exit 1
          fi
