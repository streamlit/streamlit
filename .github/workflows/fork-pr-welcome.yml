# This workflow automatically comments on pull requests from forks
# to welcome contributors and provide guidance on the review process.

name: Fork PR Welcome Comment

on:
  pull_request_target:
    types:
      - opened

jobs:
  fork-pr-welcome-comment:
    # Only run for PRs from forks
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add fork PR welcome comment
        run: gh pr comment ${{ github.event.pull_request.html_url }} --body "$PR_BODY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: |
            Thanks for contributing to Streamlit! 🎈

            Please make sure you have read our [Contributing Guide](https://github.com/streamlit/streamlit/blob/develop/CONTRIBUTING.md). You can find additional information about Streamlit development in the [wiki](https://github.com/streamlit/streamlit/tree/develop/wiki).

            **The review process:**

            1. A maintainer will do an initial triage on your PR, apply appropriate labels, approve our CI to run, and trigger some AI-review solutions. Your PR might get flagged with `status:needs-product-approval`, which means that to with proceed the proposed feature needs to be approved by our product team (→ `status:product-approved`).

            2. A core maintainer will review your PR only once:
               - It's `status:product-approved` (or doesn't need product approval)
               - All CI workflows succeed
               - All AI review comments have been resolved

            We have been getting a lot of community contributions recently and we are limited on review time, so please expect some delay. We appreciate your patience! 🙏
