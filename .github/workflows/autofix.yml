name: Autofix

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Only run if the PR has the autofix label
jobs:
  autofix:
    if: contains(github.event.pull_request.labels.*.name, 'autofix')
    runs-on: ubuntu-latest
    # Add permissions for GITHUB_TOKEN
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # Avoid duplicate workflows on same branch
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-autofix
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Streamlit code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          submodules: "recursive"
          fetch-depth: 2

      - name: Set Python version vars
        uses: ./.github/actions/build_info

      - name: Set up Python ${{ env.PYTHON_MAX_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_MAX_VERSION }}"

      - name: Setup virtual env
        uses: ./.github/actions/make_init

      - name: Run make autofix
        run: make autofix

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          git status --porcelain
          echo "changes=$(if git diff --staged --quiet; then echo false; else echo true; fi)" >> $GITHUB_OUTPUT

      - name: Commit changes to new branch
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.email "core+streamlitbot-github@streamlit.io"
          git config --global user.name "Streamlit Bot"
          fix_branch="autofix/${{ github.event.pull_request.number }}-${{ github.run_id }}"
          git checkout -b "$fix_branch"
          git add -A
          git commit -m "Apply automatic fixes"
          git push --set-upstream origin "$fix_branch"

      - name: Create PR with autofix changes
        if: steps.git-check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --head "autofix/${{ github.event.pull_request.number }}-${{ github.run_id }}" \
            --base "${{ github.head_ref }}" \
            --title "Autofix for #${{ github.event.pull_request.number }}" \
            --body $'## Describe your changes\n\nAutomated fixes for #${{ github.event.pull_request.number }} created via the autofix CI workflow. The autofix workflow is triggered by adding the `autofix` label to a PR. This runs formatting, linting, pre-commit, and other automatically fixable tasks (see `make autofix`).\n\nThis PR targets a feature branch and can be merged without review approval.'

      - name: Remove 'autofix' label from source PR
        if: steps.git-check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "autofix"
