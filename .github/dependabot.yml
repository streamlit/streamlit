version: 2
updates:
  # Keep package.json (& lockfiles) up to date as soon as
  # new versions are published to the npm registry
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    # Allow a limited number of update PRs at a time
    # to keep the number of parallel dependency updates manageable.
    open-pull-requests-limit: 8

    # Use cooldown to avoid updating dependencies too frequently
    # and minimize risk of supply chain attacks.
    cooldown:
      default-days: 5

    labels:
      - "change:chore"
      - "impact:internal"
      - "autofix"
      - "never-stale"

    ignore:
      - dependency-name: "baseui"
        # 12->13: Needs to restyle date picker
        # 13->14: Requires rewrites of lots of overrides
        versions: [">=12.3.0"]
      - dependency-name: "iframe-resizer"
        # The license was changed to GPL-3 with the 4.4.0 update.
        # We pin the version to the last version under MIT licenses.
        versions: [">=4.4.0"]
      - dependency-name: "mapbox-gl"
        # The license was changed with the 2.0 major version update.
        versions: [">=2.0.0"]
      - dependency-name: "react-map-gl"
        # The license was changed with the mapbox-gl update.
        versions: [">=5.4.0"]
      - dependency-name: "ua-parser-js"
        # The license was changed to AGPLv3 with the 2.0 major version update.
        versions: [">=2.0.0"]
      - dependency-name: "react"
        # Updating react will need some extra work.
        versions: [">=19.0.0"]
      - dependency-name: "react-dom"
        # Updating react will need some extra work.
        versions: [">=19.0.0"]
      - dependency-name: "jsdom"
        # Breaks some of our RTL unit tests
        versions: [">=25.0.0"]
      - dependency-name: "sass"
        # Breaks our build process, needs more investigation
        versions: [">=1.80.0"]
      - dependency-name: "react-window"
        # This requires us to update baseui, since that has a dependency on react-window v1.
        versions: [">=2.0.0"]
      - dependency-name: "@types/node"
        # Our types should match the version of node we're using as defined in `.nvmrc`
        versions: [">=25.0.0"]

    groups:
      deck-gl:
        patterns:
          - "@deck.gl/*"
          - "deck.gl"
          - "@loaders.gl/*"
          - "mapbox-gl"
      vega:
        patterns:
          - "vega"
          - "vega-*"
      glide-data-grid:
        patterns:
          - "@glideapps/glide-data-grid*"
      markdown-processing:
        patterns:
          - "remark-*"
          - "rehype-*"
          - "react-markdown"
          - "unified"
      eslint:
        patterns:
          - "*eslint*"
      emotion:
        patterns:
          - "*emotion*"
      vitest:
        patterns:
          - "*vitest*"
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          # Due to the coupling between vite plugins and underlying swc
          # versions, it makes sense to keep these grouped together
          - "@swc/*"
      protobufjs:
        patterns:
          - "protobufjs"
          - "protobufjs-cli"
      testing-library:
        patterns:
          - "@testing-library/*"
      d3:
        patterns:
          - "d3"
          - "d3-*"
          - "@types/d3*"
      plotly:
        patterns:
          - "*plotly*"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
      # Catch unmatched frontend minor/patch updates after the more specific groups.
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep python dependencies up to date (via uv)
  # Root pyproject.toml contains dev/test dependency groups
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    # Allow a limited number of update PRs at a time
    # to keep the number of parallel dependency updates manageable.
    open-pull-requests-limit: 8
    # The published package manifest is owned by the /lib uv job below. The
    # root uv job should only update the dev/test environment.
    exclude-paths:
      - "lib/pyproject.toml"
    # Avoid raising lower-bound constraints when the latest release is already
    # allowed; keeps the dev/test environment on broad ranges.
    versioning-strategy: increase-if-necessary

    # Use cooldown to avoid updating dependencies too frequently
    # and minimize risk of supply chain attacks.
    cooldown:
      default-days: 4

    labels:
      - "change:chore"
      - "impact:internal"
      - "autofix"
      - "never-stale"

    groups:
      python-typing:
        patterns:
          - "mypy"
          - "mypy-protobuf"
          - "ty"
          - "types-*"
          - "*-stubs"
      python-playwright:
        patterns:
          - "playwright"
          - "pytest-playwright"
          - "pixelmatch"
      python-testing:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "parameterized"
          - "requests-mock"
          - "testfixtures"

  # Keep streamlit package runtime dependencies up to date
  # lib/pyproject.toml contains the published package's dependencies
  - package-ecosystem: "uv"
    directory: "/lib"
    schedule:
      interval: "daily"
    # Let Dependabot classify the published Streamlit package as a library, which
    # widens supported version ranges internally. Explicit
    # `versioning-strategy: widen` is not currently accepted for the uv ecosystem
    # by GitHub's dependabot.yml schema (only lockfile-only, auto, increase, and
    # increase-if-necessary are), so `auto` is used to opt into widening.
    # Tracking issue: https://github.com/dependabot/dependabot-core/issues/15290
    versioning-strategy: auto

    cooldown:
      default-days: 4

    labels:
      - "change:chore"
      - "impact:users"
      - "autofix"
      - "never-stale"

  # Maintain dependencies in GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    labels:
      - "change:chore"
      - "impact:internal"
      - "autofix"
      - "never-stale"

    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      codeql-action:
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"

  # Keep pre-commit hooks up to date
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"

    labels:
      - "change:chore"
      - "impact:internal"
      - "autofix"
      - "never-stale"

    ignore:
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
        # ruff version is synced with pyproject.toml via sync-ruff-version hook
        # to ensure consistent formatting across local development and CI
