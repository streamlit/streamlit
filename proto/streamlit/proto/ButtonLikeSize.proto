syntax = "proto3";

package streamlit;

// Shared control height for button-like elements. Values are prefixed because
// GapSize already defines SMALL and MEDIUM in the streamlit package.
enum ButtonLikeSize {
  BUTTON_LIKE_SIZE_MEDIUM = 0;
  BUTTON_LIKE_SIZE_SMALL = 1;
  BUTTON_LIKE_SIZE_XSMALL = 2;
  BUTTON_LIKE_SIZE_LARGE = 3;
  BUTTON_LIKE_SIZE_XXSMALL = 4;
}
