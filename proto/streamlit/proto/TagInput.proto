syntax = "proto3";

option java_package = "com.snowflake.apps.streamlit";
option java_outer_classname = "TagInputProto";

import "streamlit/proto/LabelVisibilityMessage.proto";

message TagInput {
  string id = 1;
  string label = 2;
  repeated string default = 3;
  repeated string options = 4;
  string help = 5;
  string form_id = 6;
  repeated string value = 7;
  bool set_value = 8;
  bool disabled = 9;
  LabelVisibilityMessage label_visibility = 10;
  int32 max_tags = 11;
  string placeholder = 12;
  bool allow_duplicates = 13;

  // Next: 14
}
