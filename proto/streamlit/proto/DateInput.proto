syntax = "proto3";

import "streamlit/proto/LabelVisibility.proto";

message DateInput {
  string id = 1;
  string label = 2;
  repeated string default = 3;
  string min = 4;
  string max = 5;
  bool is_range = 6;
  string help = 7;
  string form_id = 8;
  repeated string value = 9;
  bool set_value = 10;
  bool disabled = 11;
  LabelVisibility label_visibility = 12;
  string format = 13;
  // If set, widget value is bound to this query parameter key
  optional string query_param_key = 14;

  // Set by on_change="ignore": do not schedule a rerun; buffer the value until
  // the next rerun. Bound widgets still update the URL when the value is
  // committed. Inside a form, this flag has no effect because the form batches
  // values until submit.
  bool ignore_rerun = 15;
  // If true, empty values cannot be committed (client-side).
  bool required = 16;

  // How exact dates and weekdays restrict selection inside min/max.
  // NONE: no availability filter (existing behavior).
  // ALLOW: only listed exact dates and weekdays are selectable.
  // BLOCK: listed exact dates and weekdays are not selectable.
  enum AvailabilityMode {
    NONE = 0;
    ALLOW = 1;
    BLOCK = 2;
  }
  AvailabilityMode availability_mode = 17;
  // Exact dates in ISO YYYY-MM-DD used by availability_mode. In ALLOW mode
  // these are selectable; in BLOCK mode they are not. The backend omits exact
  // dates outside min/max.
  repeated string filter_dates = 18;
  // ISO-8601 weekday numbers (Monday=1 … Sunday=7) used by availability_mode.
  // In ALLOW mode these weekdays are selectable; in BLOCK mode they are not.
  repeated int32 filter_weekdays = 19;
  // Next: 20
}
