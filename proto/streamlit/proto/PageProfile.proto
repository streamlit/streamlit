syntax = "proto3";

message PageProfile {
  repeated Command commands = 1;
  int64 exec_time = 2;
  int64 prep_time = 3;
  repeated string config = 5;
  string uncaught_exception = 6;
  repeated string attributions = 7;
  string os = 8;
  string timezone = 9;
  bool headless = 10;
  bool is_fragment_run = 11;
  // The server mode used to run the Streamlit app:
  // - "starlette-managed": Starlette server managed by Streamlit (streamlit run CLI)
  // - "starlette-app": st.App started via streamlit run
  // - "asgi-server": st.App run directly with external ASGI server (uvicorn, gunicorn)
  // - "asgi-mounted": st.App mounted on another ASGI framework (FastAPI, Starlette)
  string server_mode = 12;
  // Streamlit-shipped agent skills detected on the user's system, encoded as
  // "<location>:<harness>:<skill>" tokens. Locations are "home" (user home),
  // "app" (directory of the main script), "repo" (nearest ancestor
  // containing a ``.git`` directory, if different from ``app``), and
  // "project" (the in-app installer's resolved root — the nearest
  // ``.agents``/``.claude`` or ``.git`` ancestor — when different from both
  // ``app`` and ``repo``). Harnesses
  // are "agents", "claude", "codex", "cortex", "cursor", "gemini", and
  // "opencode" (each uses its own skills directory convention). Skills are
  // "developing-with-streamlit" and "finding-streamlit-skills".
  // Empty when no bundled skills are installed.
  repeated string installed_skills = 13;
  // Agent harnesses detected on the user's system, identified by the
  // presence of the harness's home-level config directory (e.g. ~/.claude,
  // ~/.codex, ~/.snowflake/cortex). Tokens match the harness names used
  // in ``installed_skills``. Independent of whether Streamlit skills are
  // installed in any of them. Empty when no harnesses are detected.
  repeated string installed_agents = 14;
  // Agent API activity in this server process. Unset while every count is zero.
  AgentApiUsage agent_api_usage = 15;
  // st.cache_data and st.cache_resource calls during this script run, and how
  // long the server process had been running when the run started.
  CacheUsage cache_usage = 16;
}

// Cached-function activity during one script run. Counts and durations only.
//
// The times are in microseconds, like exec_time, and come out of the time
// that is otherwise user code (exec_time minus prep_time minus the command
// times), so user code minus all cache times is the time spent outside the
// cache. To make that hold, a cached call is recorded only when:
// - It runs on a thread attached to this script run: the script thread,
//   a parallel fragment worker, or a thread passed to add_script_run_ctx.
//   Calls without a script run, such as background refreshes
//   (refresh_mode="background") and st.App lifespan tasks, are not recorded.
// - It is the outermost cached call. Calls made inside another cached
//   function are part of the outer call's compute time and are not counted.
// - It is not inside a tracked command, such as the st.cache_resource call
//   inside st.connection, whose time is already in that command's time.
// The time of tracked commands that run during a recorded call (st.* calls
// inside the cached function, and the cache write recorded as
// _cache_data_object or _cache_resource_object) is excluded from its times.
//
// Parallel fragment workers' times are added to the run's totals like their
// command times, so with concurrent workers both can exceed the run's
// wall-clock time. Async cached calls awaited concurrently on one thread
// are scaled down to the time during which any of them ran.
message CacheUsage {
  // Unset when no st.cache_data call was recorded.
  CacheTypeUsage cache_data = 1;
  // Unset when no st.cache_resource call was recorded.
  CacheTypeUsage cache_resource = 2;
  // Whole seconds since the Streamlit server process started, taken when
  // this script run started. A low value with many misses means the caches
  // were cold because the process is new (a container start, wake-up or
  // restart).
  int64 server_uptime_seconds = 3;
}

// Recorded calls for one cache type. hits + misses can be lower than calls
// when a call fails before a value is read or computed, for example because
// an argument can't be hashed.
message CacheTypeUsage {
  int64 calls = 1;
  // Calls that returned a cached value, including callers that waited for
  // another caller to compute it.
  int64 hits = 2;
  // Calls that ran the cached function, including ones where it raised.
  int64 misses = 3;
  // Hits that returned a value past its ttl while a background refresh
  // replaces it (refresh_mode="background").
  int64 stale_hits = 4;
  // Time running the cached function on misses.
  int64 compute_time = 5;
  // Time waiting for another caller (another session, thread, or background
  // refresh) to finish computing the same value.
  int64 wait_time = 6;
  // All other time in the cache: hashing the arguments, reading (for
  // st.cache_data, unpickling) the result, and replaying cached elements.
  int64 overhead_time = 7;
}

// Agent API activity in one server process. Cumulative since this process
// started, so a later page profile still includes activity from when no
// browser was connected.
message AgentApiUsage {
  // Random id of the server process, so that counts from different processes
  // (restarts, replicas, forked workers) are never mixed.
  string instance_id = 1;
  // Calls to the interact operation over HTTP, refused ones included. With the
  // API off, POSTs that pass the Host, Origin, and content-type checks.
  int64 http_interactions = 2;
  // Calls to the interact operation over MCP, refused ones included. With the
  // API off, requests that pass the same checks as the HTTP route.
  int64 mcp_interactions = 3;
  // Agent sessions created.
  int64 sessions = 4;
}

// The field names are used as part of the event json sent
// to our metrics provider. we are using short names to
// optimize for the size.
message Argument {
  // The keyword of the argument:
  string k = 1;
  // The type of the argument:
  string t = 2;
  // Some metadata about the argument value:
  string m = 3;
  // Contains the position (if positional argument):
  int32 p = 5;
}

message Command {
  string name = 1;
  repeated Argument args = 2;
  int64 time = 4;
}
