syntax = "proto3";

message PageProfile {
  repeated Command commands = 1;
  int64 exec_time = 2;
  int64 prep_time = 3;
  repeated string config = 5;
  string uncaught_exception = 6;
  repeated string attributions = 7;
  string os = 8;
  string timezone = 9;
  bool headless = 10;
  bool is_fragment_run = 11;
  // The server mode used to run the Streamlit app:
  // - "starlette-managed": Starlette server managed by Streamlit (streamlit run CLI)
  // - "starlette-app": st.App started via streamlit run
  // - "asgi-server": st.App run directly with external ASGI server (uvicorn, gunicorn)
  // - "asgi-mounted": st.App mounted on another ASGI framework (FastAPI, Starlette)
  string server_mode = 12;
  // Streamlit-shipped agent skills detected on the user's system, encoded as
  // "<location>:<harness>:<skill>" tokens. Locations are "home" (user home),
  // "app" (directory of the main script), "repo" (nearest ancestor
  // containing a ``.git`` directory, if different from ``app``), and
  // "project" (the in-app installer's resolved root — the nearest
  // ``.agents``/``.claude`` or ``.git`` ancestor — when different from both
  // ``app`` and ``repo``). Harnesses
  // are "agents", "claude", "codex", "cortex", "cursor", "gemini", and
  // "opencode" (each uses its own skills directory convention). Skills are
  // "developing-with-streamlit" and "finding-streamlit-skills".
  // Empty when no bundled skills are installed.
  repeated string installed_skills = 13;
  // Agent harnesses detected on the user's system, identified by the
  // presence of the harness's home-level config directory (e.g. ~/.claude,
  // ~/.codex, ~/.snowflake/cortex). Tokens match the harness names used
  // in ``installed_skills``. Independent of whether Streamlit skills are
  // installed in any of them. Empty when no harnesses are detected.
  repeated string installed_agents = 14;
  // Agent API activity in this server process. Unset while every count is zero.
  AgentApiUsage agent_api_usage = 15;
  // st.cache_data and st.cache_resource calls during this script run.
  CacheUsage cache_usage = 16;
  // Whole seconds since the Streamlit runtime started, taken when this run
  // started. Low values mean this process started recently, so its in-memory
  // caches are empty. Optional, so that 0 is still sent.
  optional int64 server_uptime_seconds = 17;
  // Database queries during this script run. Unset when no query was recorded.
  QueryUsage query_usage = 18;
}

// Database queries during one script run: counts, and times in microseconds.
// A query is recorded when it runs on a thread attached to the script run and
// finishes before the page profile is built. Queries saved by a cache hit
// never run, so they aren't recorded. Each retry is a separate query.
// Query times are part of user code time, except where they overlap other
// recorded times, which time_in_cache and time_in_commands report. Like
// command times, times from concurrent threads are summed and can exceed
// wall-clock time.
// lib/streamlit/connections/query_telemetry.py lists which queries are
// recorded.
message QueryUsage {
  // Snowflake Connector for Python cursors created by Streamlit:
  // SnowflakeConnection.query() and SnowflakeConnection.cursor().
  // Unset when no such query was recorded.
  QuerySourceUsage snowflake_connector = 1;
  // SQLAlchemy engines, including the one behind SQLConnection.
  // Unset when no such query was recorded.
  QuerySourceUsage sqlalchemy = 2;
  // Snowpark sessions from SnowflakeConnection.session(), and the active
  // Snowpark session, on Snowpark 1.26 and later. Snowpark reports queries
  // only after they finish, so their times aren't measured.
  // Unset when no such query was recorded.
  QuerySourceUsage snowpark = 3;
  // Snowflake query IDs of the recorded queries from all sources, in the order
  // they finished, up to the first 50 per run. A query ID contains no SQL, and
  // only someone with access to the Snowflake account can look it up, for
  // example to get compile, queue and execution time from the account's query
  // history.
  repeated string query_ids = 4;
}

// Recorded queries from one source, with times in microseconds.
message QuerySourceUsage {
  // All recorded queries, including failed, async and describe queries.
  int64 queries = 1;
  // Queries that raised an error. Snowpark reports only some failures, so
  // some failed Snowpark queries are counted only in queries.
  int64 failed = 2;
  // Queries submitted without waiting for them to finish. Their time covers
  // only the submission.
  int64 async_queries = 3;
  // Queries that only look up the shape of a result, such as the ones Snowpark
  // runs to work out a DataFrame's columns.
  int64 describe_queries = 4;
  // Queries whose time is included in time.
  int64 timed_queries = 5;
  // Time blocked in the driver's execute call: sending the query, and for a
  // query that isn't async, waiting for it to finish. Fetching the results
  // afterwards isn't included.
  int64 time = 6;
  // Part of time spent inside a cached function's computation, which
  // cache_usage already counts in compute_time.
  int64 time_in_cache = 7;
  // Part of time spent inside a listed command, which that command's time
  // already counts. For example, a lazy DataFrame passed to st.dataframe runs
  // its query inside the command.
  int64 time_in_commands = 8;
}

// Cache activity during one script run: counts, and times in microseconds.
// The times leave out time already recorded in commands, such as st.* calls
// inside a cached function, so they are part of user code time (exec_time
// minus prep_time minus command times). A cached call made inside another
// cached function counts as part of the outer call, so subtracting the times
// from user code time leaves the time spent outside the cache. Like command
// times, times from concurrent threads are summed and can exceed wall-clock
// time.
// lib/streamlit/runtime/caching/cache_call_timer.py lists which calls are
// recorded.
message CacheUsage {
  // Unset when no st.cache_data call was recorded.
  CacheTypeUsage cache_data = 1;
  // Unset when no st.cache_resource call was recorded.
  CacheTypeUsage cache_resource = 2;
}

// Recorded calls for one cache type, with times in microseconds. stale_hits
// are also counted in hits. hits + misses can be less than calls
// when a call fails or stops before reading or computing a value, for example
// on an unhashable argument or a rerun while waiting for another caller.
message CacheTypeUsage {
  int64 calls = 1;
  // Calls that returned a cached value, including callers that waited for
  // another caller to compute it.
  int64 hits = 2;
  // Calls that ran the cached function, including ones where it raised.
  int64 misses = 3;
  // Hits that returned an expired value (past the decorator's ttl) while
  // refresh_mode="background" replaces it.
  int64 stale_hits = 4;
  // Time running the cached function on misses, excluding time recorded in
  // commands.
  int64 compute_time = 5;
  // Time blocked while another session, thread or background refresh
  // computes the same value.
  int64 wait_time = 6;
  // Calls that waited, counted once each even if a call waited more than once.
  int64 waits = 8;
  // All other cache time: hashing the arguments, reading the result (and for
  // st.cache_data, unpickling it), and replaying cached elements. Includes
  // the cache write when the limits on tracked commands (_MAX_TRACKED_COMMANDS
  // and _MAX_TRACKED_PER_COMMAND in metrics_util.py) left it out of commands.
  int64 overhead_time = 7;
}

// Agent API activity in one server process. Cumulative since this process
// started, so a later page profile still includes activity from when no
// browser was connected.
message AgentApiUsage {
  // Random id of the server process, so that counts from different processes
  // (restarts, replicas, forked workers) are never mixed.
  string instance_id = 1;
  // Calls to the interact operation over HTTP, refused ones included. With the
  // API off, POSTs that pass the Host, Origin, and content-type checks.
  int64 http_interactions = 2;
  // Calls to the interact operation over MCP, refused ones included. With the
  // API off, requests that pass the same checks as the HTTP route.
  int64 mcp_interactions = 3;
  // Agent sessions created.
  int64 sessions = 4;
}

// The field names are used as part of the event json sent
// to our metrics provider. we are using short names to
// optimize for the size.
message Argument {
  // The keyword of the argument:
  string k = 1;
  // The type of the argument:
  string t = 2;
  // Some metadata about the argument value:
  string m = 3;
  // Contains the position (if positional argument):
  int32 p = 5;
}

message Command {
  string name = 1;
  repeated Argument args = 2;
  int64 time = 4;
}
