syntax = "proto3";

option java_package = "com.snowflake.apps.streamlit";
option java_outer_classname = "ChatInputProto";

message ChatInput {
  string id = 1;
  string placeholder = 2;
  uint32 max_chars = 3;
  bool disabled = 4;
  string value = 5;
  bool set_value = 6;
  string default = 7;

  // DEPRECATED: position property is deprecated and unused.
  enum Position {
    BOTTOM = 0;
  }
  Position position = 8;

  enum AcceptImage {
    NONE = 0;
    SINGLE = 1;
    MULTIPLE = 2;
    DIRECTORY = 3;
  }
  AcceptImage accept_image = 9;

  // Supported image types: For example: ["png","jpg","img"]
  repeated string image_type = 10;

  // New file upload support (persistent files, like file_uploader)
  enum AcceptFile {
    FILE_NONE = 0;
    FILE_SINGLE = 1;
    FILE_MULTIPLE = 2;
    FILE_DIRECTORY = 3;
  }
  AcceptFile accept_file = 13;

  // Supported file types for persistent files: For example: ["txt","csv","pdf"]
  repeated string file_type = 14;

  // Max file size allowed by server config
  int32 max_upload_size_mb = 11;

  // Whether to show audio recording button
  bool accept_audio = 12;
}
