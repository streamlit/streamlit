syntax = "proto3";

message EChartsChart {
  // JSON-serialized ECharts option object.
  string spec = 1;

  // Override the properties with a theme. Currently, only "streamlit" or None
  // are accepted.
  string theme = 2;

  // The unique element ID of this chart. Populated only when selections are
  // activated.
  string id = 3;

  // Activate selection types on the chart. Empty means display only.
  repeated SelectionMode selection_mode = 4;

  // Form ID, filled if selections are activated.
  string form_id = 5;

  // Renderer passed to echarts.init.
  Renderer renderer = 6;

  // Available selection modes:
  enum SelectionMode {
    POINTS = 0; // Point selection mode.
    BOX = 1; // Box (rectangle brush) selection mode.
    LASSO = 2; // Lasso (polygon brush) selection mode.
  }

  // Available renderers:
  enum Renderer {
    CANVAS = 0; // Canvas renderer.
    SVG = 1; // SVG renderer.
  }
}
