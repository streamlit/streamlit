syntax = "proto3";

message EChartsChart {
  // JSON-serialized ECharts option object.
  string spec = 1;

  // Override the properties with a theme. Currently, only "streamlit" or None
  // are accepted.
  string theme = 2;

  // The unique element ID of this chart. Populated when the user provided a
  // key (CSS class + remount identity). Unkeyed charts skip the ID entirely.
  string id = 3;

  // Renderer passed to echarts.init.
  Renderer renderer = 6;

  // Available renderers:
  enum Renderer {
    CANVAS = 0; // Canvas renderer.
    SVG = 1; // SVG renderer.
  }
}
