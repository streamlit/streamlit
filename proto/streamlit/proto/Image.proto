syntax = "proto3";

option java_package = "com.snowflake.apps.streamlit";
option java_outer_classname = "ImageProto";

python - <<'PY'
from pathlib import Path
pdir = Path('proto/streamlit/proto')
files = sorted(pdir.glob('*.proto'))
changed=[]
for p in files:
    s = p.read_text(encoding='utf-8')
    # Only act if syntax exists and package not already present in first 12 lines
    header = '\n'.join(s.splitlines()[:12])
    if 'syntax = "proto3";' in header and 'package ' not in header:
        s = s.replace('syntax = "proto3";\n', 'syntax = "proto3";\npackage streamlit;\n\n', 1)
        p.write_text(s, encoding='utf-8')
        changed.append(str(p))
print("Updated files (added package streamlit;):")
for c in changed: print("  ", c)
if not changed:
    print("No files needed package insertion.")
PY


package streamlit.proto;

// An image which can be displayed on the screen.
message Image {
  string url = 3;
  string caption = 2;

  // DEPRECATED: markup is not used anymore.
  // SVGs are added as data uris in the url field.
  string markup = 4;

  reserved 1;
  reserved "data";
}

// A set of images.
message ImageList {
  repeated Image imgs = 1;

  // DEPRECATED use widthConfig on Element.proto
  int32 width = 2 [deprecated = true];
}
