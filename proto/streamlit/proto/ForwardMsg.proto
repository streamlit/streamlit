syntax = "proto3";

import "streamlit/proto/ArrowData.proto";
import "streamlit/proto/AuthRedirect.proto";
import "streamlit/proto/AutoRerun.proto";
import "streamlit/proto/Common.proto";
import "streamlit/proto/Delta.proto";
import "streamlit/proto/GitInfo.proto";
import "streamlit/proto/Logo.proto";
import "streamlit/proto/Navigation.proto";
import "streamlit/proto/NewSession.proto";
import "streamlit/proto/PageConfig.proto";
import "streamlit/proto/PageInfo.proto";
import "streamlit/proto/PageNotFound.proto";
import "streamlit/proto/PageProfile.proto";
import "streamlit/proto/ParentMessage.proto";
import "streamlit/proto/SessionEvent.proto";
import "streamlit/proto/SessionStatus.proto";

// A message sent from Proxy to the browser
message ForwardMsg {
  // A hash that uniquely identifies this ForwardMsg, for caching.
  string hash = 1;

  // Contains 'non-payload' ForwardMsg data that isn't cached for the purposes
  // of ForwardMsg de-duping.
  ForwardMsgMetadata metadata = 2;

  // Values for the 'script_finished` type
  enum ScriptFinishedStatus {
    // The script compiled and ran.
    FINISHED_SUCCESSFULLY = 0;

    // The script failed to compile
    FINISHED_WITH_COMPILE_ERROR = 1;

    // Script was interrupted by rerun
    FINISHED_EARLY_FOR_RERUN = 2;

    // A fragment of the script ran successfully.
    FINISHED_FRAGMENT_RUN_SUCCESSFULLY = 3;
  }

  oneof type {
    // App lifecycle messages.
    NewSession new_session = 4;
    Delta delta = 5;
    PageInfo page_info_changed = 12;
    PageConfig page_config_changed = 13;
    ScriptFinishedStatus script_finished = 6;
    GitInfo git_info_changed = 14;
    PageProfile page_profile = 18;

    // Status change and event messages.
    SessionStatus session_status_changed = 9;
    SessionEvent session_event = 10;

    // Other messages.
    Navigation navigation = 23;
    PageNotFound page_not_found = 15;
    FileURLsResponse file_urls_response = 19;
    AutoRerun auto_rerun = 21;
    StopAutoRerun stop_auto_rerun = 28;

    // App logo message
    Logo logo = 22;

    // Auth redirect message
    AuthRedirect auth_redirect = 24;

    // Platform - message to host
    ParentMessage parent_message = 20;

    // A reference to a ForwardMsg that has already been delivered
    // and cached in the frontend. The client should substitute the message
    // with the given hash for this one.
    string ref_hash = 11;

    // Acknowledgment of app_heartbeat BackMsg, used for connection health
    // monitoring. When the frontend sends an app_heartbeat, the server
    // responds with this ack so the frontend can verify the connection is
    // healthy.
    bool heartbeat_ack = 26;

    // Generic backend operation response for server-side operations.
    // Corresponds to BackendOperationRequest in BackMsg.
    BackendOperationResponse backend_operation_response = 27;
  }

  // The ID of the last BackMsg that we received before sending this
  // ForwardMsg. As its name suggests, this field should only be used for
  // testing.
  string debug_last_backmsg_id = 17;

  reserved 7, 8, 16, 25;
  // Next: 29
}

// Generic backend operation response for server-side operations without script rerun.
message BackendOperationResponse {
  // Matches the request_id from BackendOperationRequest
  string request_id = 1;

  // Error message if request failed (empty on success)
  string error_msg = 2;

  // Machine-readable, bounded failure classification (empty on success).
  // Parallels the human-readable error_msg. For the one-click skills install
  // this is the cause of the failure (e.g. "conflict", "write_failed",
  // "source_missing"), forwarded to telemetry so the nudge's install-failure
  // rate can be broken down by cause.
  string error_reason = 7;

  oneof payload {
    // Response for deferred file requests
    DeferredFileResponsePayload deferred_file = 3;

    // Response for one-click skills install requests
    InstallSkillsResponsePayload install_skills = 4;

    // Acknowledgement for permanently dismissing the skills nudge
    DismissSkillsNudgeResponsePayload dismiss_skills_nudge = 5;

    // Response for lazy dataframe row chunk requests
    DataframeChunkResponsePayload dataframe_chunk = 6;
  }
}

// Response payload for deferred file downloads
message DeferredFileResponsePayload {
  string url = 1;
}

// Response payload for one-click skills install. A successful, empty detail
// indicates a clean install; failures are not reported here at all, but via the
// parent response's error_msg (human-readable) and error_reason (machine-readable).
message InstallSkillsResponsePayload {
  // Optional human-readable detail about the install outcome.
  string detail = 1;

  // Why a project install was rerouted to a global copy, empty when it wasn't:
  //   "symlinks_no_privilege" - Windows Developer Mode off (ERROR_PRIVILEGE_NOT_HELD)
  //   "symlinks_denied"       - permissions on the project dir refused the probe
  //   "symlinks_unsupported"  - the filesystem/OS has no directory symlinks
  //   "symlink_failed"        - pre-check passed, then an individual link would not lay
  // Split this finely because most Windows users take this path and then SUCCEED, so
  // this is where their diagnostic signal lives - and only the first of these is
  // something a user can simply fix. Lets the nudge telemetry count each cohort
  // (skillsNudgeInstallSucceeded:<fallback_reason>), since a fallback install is
  // otherwise indistinguishable from a project install.
  string fallback_reason = 3;

  // 2 was a bool used_global_fallback, superseded by the fallback_reason string
  // above. Never released, but a PR preview wheel carried it, so the number is
  // retired rather than retyped.
  reserved 2;
}

// Acknowledgement payload for dismissing the skills nudge. Carries no data;
// its presence signals the marker was written successfully.
message DismissSkillsNudgeResponsePayload {}

// Response payload for lazy dataframe row chunks. Carries the requested rows
// serialized as Arrow IPC bytes.
message DataframeChunkResponsePayload {
  // Echoes the requested source id so the frontend can match the response.
  string source_id = 1;
  // Row offset of the first row in `arrow_data`.
  uint64 offset = 2;
  // Reserved for future sequential sources; always false for known-size
  // random-access sources.
  bool end_of_stream = 3;
  // The requested rows as an Arrow IPC table.
  ArrowData arrow_data = 4;
}

// ForwardMsgMetadata contains all data that does _not_ get hashed (or cached)
// in our ForwardMsgCache. (That is, when we cache a ForwardMsg, we clear its
// metadata field first.) This allows us to, e.g., have a large unchanging
// dataframe appear in different places across multiple reruns - or even appear
// multiple times in a single run - and only send its dataframe bytes once.
message ForwardMsgMetadata {
  // Marks a message as cacheable for the frontend.
  bool cacheable = 1;

  // The path that identifies a delta's location in the report tree.
  // Only set for Delta messages.
  repeated uint32 delta_path = 2;

  // active_script_hash the forward message is associated from.
  // For multipage apps v1, this will always be the page file running
  // For multipage apps v2, this can be the main script or the page script
  string active_script_hash = 4;

  reserved 3;
}

// This is a list of ForwardMessages used to have a single protobuf message
// that encapsulates multiple ForwardMessages. This is used in static streamlit app
// generation in replaying all of the protobuf messages of a streamlit app. The
// ForwardMsgList allows us to leverage the built-ins of protobuf in delimiting the ForwardMsgs
// instead of needing to do that ourselves.
message ForwardMsgList {
  repeated ForwardMsg messages = 1;
}
