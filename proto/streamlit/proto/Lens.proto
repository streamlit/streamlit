syntax = "proto3";

import "streamlit/proto/LabelVisibility.proto";

message Lens {
  string id = 1;
  string label = 2;
  string target_key = 3;
  string prompt = 4;
  bytes snapshot = 5;
  string result = 6;
  bool capture_triggered = 7;
  bool result_ready = 8;
  float position_x = 9;
  float position_y = 10;
  float width = 11;
  float height = 12;
  string help = 13;
  bool disabled = 14;
  LabelVisibility label_visibility = 15;
  bool closed = 16;
}
