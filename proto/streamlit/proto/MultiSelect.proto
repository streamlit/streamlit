syntax = "proto3";

import "streamlit/proto/LabelVisibility.proto";

message MultiSelect {
  enum SearchType {
    FUZZY = 0;
    EXACT = 1;
    CONTAINS = 2;
    STARTS_WITH = 3;
  }

  string id = 1;
  string label = 2;
  repeated int32 default = 3;
  repeated string options = 4;
  string help = 5;
  string form_id = 6;

  // after we introduced accept_new_options, we send the option as a string
  // instead of an index to keep it simple.
  repeated string raw_values = 14;

  bool set_value = 8;
  bool disabled = 9;
  LabelVisibility label_visibility = 10;
  int32 max_selections = 11;
  string placeholder = 12;
  optional bool accept_new_options = 13;
  // If set, widget value is bound to this query parameter key
  optional string query_param_key = 15;
  SearchType search_type = 16;

  // Group metadata for dict-based options. group_labels contains the name
  // of each group; group_sizes contains the number of items in each group.
  // The options field remains a flat list; groups are reconstructed on the
  // frontend from these two parallel arrays.
  repeated string group_labels = 17;
  repeated int32 group_sizes = 18;

  // Next: 19

  reserved 7;
}
