syntax = "proto3";

import "streamlit/proto/Arrow.proto";

option java_package = "com.snowflake.apps.streamlit";
option java_outer_classname = "TableProto";

// Table message for st.table element.
// This is a simplified version of the Arrow message, containing only
// the fields needed for static table display.
message Table {
  // The serialized arrow dataframe
  bytes data = 1;
  // Pandas styler information (reuses Styler from Arrow.proto)
  Styler styler = 2;
  // How to show borders around the table and between cells.
  BorderMode border_mode = 3;

  // Available border modes:
  enum BorderMode {
    ALL = 0; // Show borders around the table and between cells.
    NONE = 1; // Show no borders.
    HORIZONTAL = 2; // Show only horizontal borders between rows.
  }
}
