syntax = "proto3";

import "streamlit/proto/ArrowData.proto";

// Proto message for st.dataframe and st.data_editor elements.
message Dataframe {
  // The Arrow data to display
  ArrowData arrow_data = 1;

  // The id of the widget, this is required if the dataframe is editable
  string id = 2;
  // Column configuration as JSON
  string columns = 3;
  // Activate table editing
  EditingMode editing_mode = 4;
  // Deactivates editing
  bool disabled = 5;
  // The form ID of the widget, this is required if the dataframe is editable
  string form_id = 6;
  // Defines the order in which columns are displayed
  repeated string column_order = 7;
  // Activated dataframe selections events
  repeated SelectionMode selection_mode = 8;
  // Row height in pixels
  optional uint32 row_height = 9;
  // Placeholder string used when rendering missing values (e.g. nulls, NaNs).
  optional string placeholder = 10;
  // Selection state (JSON serialized), set when selection is changed programmatically
  // via session state. When present, frontend applies this selection.
  // When absent, frontend manages its own selection state.
  optional string selection_state = 11;
  // Default selection state (JSON serialized), set when selection_default is provided.
  // Applied by the frontend only when there is no stored selection state.
  optional string selection_default = 12;
  // Map of column name → widget ID for button column click events.
  // Each ButtonColumn with a key parameter registers a single widget that is
  // shared by all rows of that column (one entry per column, not per row). The
  // clicked row index and button label are sent as part of that widget's value,
  // so a single widget ID per column is sufficient to handle clicks on any row.
  map<string, string> button_click_widgets = 13;

  // Lazy-loading metadata. When set, the frontend renders this dataframe in
  // lazy mode: it requests row chunks from the backend on demand instead of
  // receiving the full data in `arrow_data`. The eager `arrow_data` field is
  // left empty for lazy dataframes.
  optional LazyDataframe lazy_data = 14;

  // Available editing modes:
  enum EditingMode {
    READ_ONLY = 0; // Read-only table.
    FIXED = 1; // Activates editing but only allow editing of existing cells.
    DYNAMIC = 2; // Activates editing and allow adding & deleting rows.
    ADD_ONLY = 3; // Activates editing and allow adding rows (no deleting).
    DELETE_ONLY = 4; // Activates editing and allow deleting rows (no adding).
  }

  // Available selection modes:
  enum SelectionMode {
    SINGLE_ROW = 0; // Only one row can be selected at a time.
    MULTI_ROW = 1; // Multiple rows can be selected at a time.
    SINGLE_COLUMN = 2; // Only one column can be selected at a time.
    MULTI_COLUMN = 3; // Multiple columns can be selected at a time.
    SINGLE_CELL = 4; // Only one cell can be selected at a time.
    MULTI_CELL = 5; // Multiple cells (continuous range) can be selected.
    SINGLE_ROW_REQUIRED = 6; // Single row, cannot be cleared (radio-like behavior).
  }
}

// Metadata for a lazily loaded dataframe. The data itself is fetched on demand
// in row chunks via BackendOperationRequest/BackendOperationResponse, keyed by
// `source_id` and `generation`.
message LazyDataframe {
  // Session-scoped, unguessable id of the backend data source. Used by the
  // frontend to request row chunks. Not usable across sessions.
  string source_id = 1;

  // Total number of rows in the source. Always set in the first version
  // (known-size sources). Reserved as optional for future sequential sources.
  optional uint64 row_count = 2;

  // Row offset of the rows contained in `initial_chunk`.
  uint64 initial_offset = 3;

  // Number of rows the backend serves per chunk. The frontend aligns its chunk
  // requests to this page size.
  uint32 page_size = 4;

  // Generation token (UUID) that changes whenever the source is re-registered
  // (rerun or source-config change). Chunk responses with a stale generation
  // are ignored by the frontend.
  string generation = 5;

  // How the source can be accessed.
  AccessMode access_mode = 6;

  // The initial row chunk as an Arrow IPC table including the full schema.
  // For lazy dataframes this carries the schema and the first visible rows.
  ArrowData initial_chunk = 7;

  // Arrow IPC schema bytes. Only used as a fallback when `initial_chunk` is
  // empty and a zero-row Arrow table is impractical for an adapter.
  bytes serialized_schema = 8;

  // Whether server-side sorting is enabled for this source.
  bool sortable = 9;

  enum AccessMode {
    ACCESS_MODE_UNSPECIFIED = 0;
    // Arbitrary row ranges can be requested (known-size sources).
    RANDOM_ACCESS = 1;
    // Rows can only be read sequentially (reserved for future streaming
    // sources).
    SEQUENTIAL = 2;
  }
}

// Server-side sort state for a lazy dataframe. The `column` value is a stable
// backend field name from the Arrow schema, not the displayed column label.
message SortState {
  string column = 1;
  SortDirection direction = 2;

  enum SortDirection {
    SORT_DIRECTION_UNSPECIFIED = 0;
    ASCENDING = 1;
    DESCENDING = 2;
  }
}
