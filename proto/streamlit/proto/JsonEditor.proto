syntax = "proto3";

message JsonEditor {
  // Unique ID for the widget.
  string id = 1;
  // The default JSON value as a string.
  string default = 2;
  // The current JSON value as a string (set from frontend).
  optional string value = 3;
  // Whether the value has been set from the frontend.
  bool set_value = 4;
  // Whether editing is disabled (read-only mode).
  bool disabled = 5;
  // Height in pixels (0 means auto-size).
  int32 height = 6;
  // The form ID if this widget is inside a form.
  string form_id = 7;
  // The input type: "dict", "list", or "string".
  // Used to determine the return type.
  string input_type = 8;
}
