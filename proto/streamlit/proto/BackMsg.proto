syntax = "proto3";

import "streamlit/proto/ClientState.proto";
import "streamlit/proto/Common.proto";
import "streamlit/proto/Dataframe.proto";

// A message from the browser to the server.
message BackMsg {
  oneof type {
    // Requests that the app's @st_cache be cleared
    bool clear_cache = 5;

    // Requests that the runOnSave behavior for this app be set
    // to the given value
    bool set_run_on_save = 6;

    // Requests that the script's execution be stopped
    bool stop_script = 7;

    ClientState rerun_script = 11;

    bool load_git_info = 12;

    // Test and dev-mode only field used to ask the server to disconnect the
    // client's websocket connection. This message is IGNORED unless the
    // runtime is configured with global.developmentMode = True.
    bool debug_disconnect_websocket = 14;

    // Test and dev-mode only field used to ask the server to shut down the
    // runtime. This message is IGNORED unless the runtime is configured with
    // global.developmentMode = True.
    bool debug_shutdown_runtime = 15;

    // Requests that the server generate URLs for getting/uploading/deleting
    // files for the `st.file_uploader` widget
    FileURLsRequest file_urls_request = 16;

    // Sends an app heartbeat message through the websocket
    bool app_heartbeat = 17;

    // Generic backend operation request for server-side operations without script rerun.
    // Used for server-side operations like deferred downloads, lazy dataframe loading, server-side validation, autocompletion, etc.
    BackendOperationRequest backend_operation_request = 19;
  }

  // An ID used to associate this BackMsg with the corresponding ForwardMsgs
  // that are sent to the client due to it. As its name suggests, this field
  // should only be used for testing.
  string debug_last_backmsg_id = 13;

  reserved 1, 2, 3, 4, 8, 9, 10, 18;
  // Next: 20
}

// Generic backend operation request for server-side operations without script rerun.
message BackendOperationRequest {
  // Unique request ID (UUID) generated by the frontend
  string request_id = 1;

  // Session ID validated against the WebSocket's AppSession before dispatch
  string session_id = 2;

  oneof payload {
    // Deferred file download request
    DeferredFileRequestPayload deferred_file = 3;

    // One-click install of the bundled Streamlit agent skills
    InstallSkillsRequestPayload install_skills = 4;

    // Permanently dismiss the "install skills" nudge (writes a server-side
    // marker so it is not shown again)
    DismissSkillsNudgeRequestPayload dismiss_skills_nudge = 5;

    // Lazy dataframe row chunk request
    DataframeChunkRequestPayload dataframe_chunk = 6;
  }
}

// Payload for deferred file requests
message DeferredFileRequestPayload {
  string file_id = 1;
}

// Payload for one-click skills install. Currently carries no options; the
// server installs in project mode by default.
message InstallSkillsRequestPayload {}

// Payload to permanently dismiss the "install skills" nudge.
message DismissSkillsNudgeRequestPayload {}

// Payload for lazy dataframe row chunk requests. Asks the backend to return a
// range of rows for a registered lazy dataframe source without a script rerun.
message DataframeChunkRequestPayload {
  reserved 4;
  reserved "generation";

  // Session-scoped id of the lazy dataframe source.
  string source_id = 1;
  // Row offset of the first requested row.
  uint64 offset = 2;
  // Maximum number of rows to return (the server enforces an upper bound).
  uint32 limit = 3;
  // Optional server-side sort state to apply before slicing.
  optional SortState sort = 5;
}
