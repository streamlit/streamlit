syntax = "proto3";

import "streamlit/proto/ArrowData.proto";

// Perspective element for interactive tabular data exploration.
// Uses client-side WebAssembly runtime in the browser with Arrow data.
message Perspective {
  // The Arrow data to display.
  ArrowData data = 1;

  // JSON-encoded default config to seed the viewer on first load or reset.
  // This follows Perspective's viewer configuration format with keys:
  // plugin, columns, group_by, split_by, sort, filter, aggregates, expressions, settings.
  optional string default_config_json = 2;

  // Theme name: "streamlit" uses a Streamlit-generated Perspective theme,
  // other strings are passed through as Perspective theme names.
  optional string theme = 3;

  // Element ID used for state persistence.
  optional string id = 4;

  // Hash of the Arrow schema, used to detect schema changes that require
  // resetting the viewer state.
  optional string schema_digest = 5;
}
