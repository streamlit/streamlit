syntax = "proto3";

import "streamlit/proto/PageProfile.proto";

// Metrics events:
message MetricsEvent {
  // Common Event Fields:
  string event = 1;
  string anonymous_id = 2;
  string machine_id_v3 = 3;
  string machine_id_v4 = 41;
  string report_hash = 4;
  bool dev = 5;
  string source = 6;
  string streamlit_version = 7;
  bool is_hello = 8;
  string app_id = 33;
  string session_id = 35;
  string python_version = 36;
  string server_os = 42;
  bool has_display = 43;
  bool is_webdriver = 44;

  // Host tracking fields:
  string hosted_at = 9;
  string owner = 10;
  string repo = 11;
  string branch = 12;
  string main_module = 13;
  string creator_id = 14;

  // Context fields:
  string context_page_url = 15;
  string context_page_title = 16;
  string context_page_path = 17;
  string context_page_referrer = 18;
  string context_page_search = 19;
  string context_locale = 20;
  string context_user_agent = 21;

  // Menu Click Event field:
  string label = 22;
  // Which UI surface emitted the menu click (e.g. "toast", "errorCallout").
  // Used to attribute skills-install funnel events to the surface that drove
  // them. Empty for menu clicks that don't set it.
  string surface = 48;

  // Page Profile Event fields:
  // Same as PageProfile msg
  repeated Command commands = 23;
  int64 exec_time = 24;
  int64 prep_time = 25;
  repeated string config = 26;
  string uncaught_exception = 27;
  repeated string attributions = 28;
  string os = 29;
  string timezone = 30;
  bool headless = 31;
  bool is_fragment_run = 32;

  // Addtl for page profile metrics
  int64 num_pages = 34;
  string page_script_hash = 37;
  string active_theme = 38;
  int64 total_load_time = 39;
  BrowserInfo browser_info = 40;
  string server_mode = 45;
  repeated string installed_skills = 46;
  repeated string installed_agents = 47;
  // Same as PageProfile.agent_api_usage.
  AgentApiUsage agent_api_usage = 49;
  // Same as PageProfile.cache_usage.
  CacheUsage cache_usage = 50;
  // Same as PageProfile.server_uptime_seconds.
  optional int64 server_uptime_seconds = 51;
  // Same as PageProfile.script_cpu_time.
  optional int64 script_cpu_time = 52;
  // Same as PageProfile.command_cpu_time.
  optional int64 command_cpu_time = 53;
  // Same as PageProfile.parallel_fragment_cpu_time.
  optional int64 parallel_fragment_cpu_time = 54;
  // Same as PageProfile.process_cpu_time.
  optional int64 process_cpu_time = 55;
  // Same as PageProfile.parallel_fragment_usage.
  ParallelFragmentUsage parallel_fragment_usage = 56;
  // Same as PageProfile.query_usage.
  QueryUsage query_usage = 57;
  // 58-59 are held for planned rerun-reason fields.
  // Index of the script run within this page load, starting at 0 for the
  // first run. Together with session_id, joins a run's pageProfile and
  // renderTiming events. Unset when render timing isn't measured (local
  // apps, usage stats off).
  optional int64 run_index = 60;
  // Set on renderTiming events only. See RenderTiming.
  RenderTiming render_timing = 61;
  // Same as PageProfile.arrow_bytes.
  optional int64 arrow_bytes = 62;
  // Messages the browser received for this script run. Not in PageProfile,
  // because only the browser measures it.
  ReceivedMessages received_messages = 63;

  // Browser load milestones for the run, in milliseconds from the run's
  // start. Only the browser measures them, so they aren't in PageProfile. A
  // run starts at:
  // - Navigation start, for the first run of a page load.
  // - The browser's first rerun request since the previous run started.
  // - Its NewSession message, if the browser didn't request the run.
  // Unset for apps served from a local or private-network address, which
  // measure a developer's machine rather than the app's users.
  //
  // First run only: when the frontend app mounted, after the HTML and
  // JavaScript were downloaded and run.
  optional int64 app_shell_ready_ms = 64;
  // First run only: when the first NewSession was handled, after the
  // WebSocket opened and the session started.
  optional int64 connected_ms = 65;
  // When the PageProfile message was handled. Same end point as
  // total_load_time.
  optional int64 script_finished_ms = 66;

  // Next ID: 67
}

// ForwardMsgs the browser received for one script run, from its NewSession
// through its PageProfile. Sizes are encoded bytes.
message ReceivedMessages {
  // Total size of the messages received. A reference to a cached message
  // counts at the reference's size.
  int64 bytes = 1;
  // How many of those messages were references to a cached message.
  int64 cached_messages = 2;
  // Total size of the cached messages those references resolved to.
  int64 cached_bytes = 3;
}

// Browser-side timing of one script run, sent in a renderTiming event once
// every visible element of the run has finished loading, or earlier when the
// run is hidden, superseded or times out. Durations only; no app content.
//
// first_content_ms and fully_loaded_ms are milliseconds from the same run
// start as the pageProfile event's app_shell_ready_ms, connected_ms and
// script_finished_ms, so the milestones of a run can be compared across its
// two events. Milestones that weren't reached are unset.
//
// New or changed elements are those the run sent with content different
// from what the page already showed. Elements the script sends again
// unchanged keep their payload and don't count.
message RenderTiming {
  // When the first new or changed element of the run was painted, counting
  // only elements that were in the viewport, and not skeletons, spinners,
  // progress bars, st.empty or st.space.
  optional int64 first_content_ms = 1;
  // When every new or changed element of the run in the viewport had
  // finished drawing, and never before script_finished_ms. Unset when the
  // run was hidden, superseded or timed out.
  optional int64 fully_loaded_ms = 2;

  // Time after the script finished (until fully_loaded_ms, or the timeout)
  // that visible elements spent waiting on each kind of work. Each field is
  // the time at least one visible element was waiting, so the two can
  // overlap. The rest of the gap is mostly charts and the dataframe grid
  // drawing. Not waited on: st.audio, Components v2 (including st.pdf), and,
  // on reruns, dataframes and Plotly and deck.gl charts redrawing.
  //
  // Time spent loading code-split element bundles.
  int64 code_loading_ms = 3;
  // Time spent loading images, video and iframes (including custom
  // components).
  int64 media_loading_ms = 4;

  // Number of new or changed elements in the viewport that counted toward
  // fully_loaded_ms.
  int32 visible_elements = 5;
  // Lower bound in CSS pixels of the viewport width and height bucket.
  int32 viewport_width_bucket = 6;
  int32 viewport_height_bucket = 7;

  // The page was hidden (for example a background tab) at some point while
  // the run was measured. Hidden pages don't paint, so timings are not
  // representative.
  bool was_hidden = 8;
  // Another rerun was requested or started before this run fully loaded.
  // That includes run_every fragment reruns, which can supersede a slow
  // first load.
  bool was_superseded = 9;
  // Visible elements didn't finish loading within the timeout after the
  // script finished. An element that fails to render counts as loaded once
  // its error message is painted. A chart library that fails without an
  // error message, such as a Vega spec that doesn't compile, shows up as a
  // timeout.
  bool timed_out = 10;
  // Number of elements that hadn't finished loading at the timeout: visible
  // elements, and elements whose visibility hadn't been reported yet. The
  // latter aren't in visible_elements, so this can be the larger number.
  int32 timed_out_elements = 11;
}

message BrowserInfo {
  string browser_name = 1;
  string browser_version = 2;
  string device_type = 3;
  string os = 4;
}
