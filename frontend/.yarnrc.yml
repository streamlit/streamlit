nodeLinker: node-modules

# Exclude packages published in the last 24 hours to lower risk from supply chain attacks
npmMinimalAgeGate: 1440

# Suppress peer warnings verified to be harmless:
# - @toast-ui/react-editor declares React 17 but works with our React 18.
# - vite-plugin-terminal declares Vite 7 but works with our Vite 8.
# - @streamlit/lib's React peers come from the hoisted root install because
#   Yarn does not virtualize workspaces.
# Also suppress Yarn's aggregate summaries; detailed messages for unrelated
# peer mismatches remain visible.
logFilters:
  - pattern: "react is listed by your project with version 18.*@toast-ui/react-editor*"
    level: discard
  - pattern: "vite is listed by your project with version 8.*vite-plugin-terminal*"
    level: discard
  - pattern: "@streamlit/lib@workspace:lib doesn't provide react (*"
    level: discard
  - pattern: "@streamlit/lib@workspace:lib doesn't provide react-dom (*"
    level: discard
  - pattern: "Some peer dependencies are incorrectly met by your project;*"
    level: discard
  - pattern: "Some peer dependencies are incorrectly met by dependencies;*"
    level: discard

plugins:
  - checksum: 374f735053958b77583ef7b70e56a59540d1d9c681f04b8ab7a600f4325301d2e1fb67c51d34ba75bbbc4e71f8c003fbc52b1f22d7daa30dca655f1a1bf205a1
    path: .yarn/plugins/@yarnpkg/plugin-licenses.cjs
    spec: "https://raw.githubusercontent.com/mhassan1/yarn-plugin-licenses/v0.15.0/bundles/@yarnpkg/plugin-licenses.js"
