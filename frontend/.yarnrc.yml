nodeLinker: node-modules

# Mark optional peer dependencies that we don't need to install.
# This silences YN0002 warnings for packages with optional/unused peer deps.
packageExtensions:
  # deck.gl optional peer dependencies (not used in Streamlit)
  "@deck.gl/arcgis@*":
    peerDependenciesMeta:
      "@arcgis/core":
        optional: true
  "@deck.gl/carto@*":
    peerDependenciesMeta:
      "@deck.gl/extensions":
        optional: true
  "@deck.gl/geo-layers@*":
    peerDependenciesMeta:
      "@deck.gl/extensions":
        optional: true
  "@deck.gl/react@*":
    peerDependenciesMeta:
      "@deck.gl/widgets":
        optional: true
  # @glideapps/glide-data-grid uses marked for markdown rendering (not used in Streamlit)
  "@glideapps/glide-data-grid@*":
    peerDependenciesMeta:
      marked:
        optional: true
  # vite-plugin-dts uses tsconfig, typescript peer dep is optional
  "vite-plugin-dts@*":
    peerDependenciesMeta:
      typescript:
        optional: true

plugins:
  - checksum: 374f735053958b77583ef7b70e56a59540d1d9c681f04b8ab7a600f4325301d2e1fb67c51d34ba75bbbc4e71f8c003fbc52b1f22d7daa30dca655f1a1bf205a1
    path: .yarn/plugins/@yarnpkg/plugin-licenses.cjs
    spec: "https://raw.githubusercontent.com/mhassan1/yarn-plugin-licenses/v0.15.0/bundles/@yarnpkg/plugin-licenses.js"
