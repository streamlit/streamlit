nodeLinker: node-modules

# Exclude packages published in the last 24 hours to lower risk from supply chain attacks
npmMinimalAgeGate: 1440

logFilters:
  # @toast-ui/react-editor is an indirect dependency of Glide Data Grid. Its
  # published peer range stops at React 17, but its editor integration is
  # covered by our React 18 frontend tests. The pattern is limited to React 18
  # and this package, so a future React major or different package stays visible.
  - pattern: "react is listed by your project with version 18.*@toast-ui/react-editor*"
    level: discard
  # vite-plugin-terminal's published peer range stops at Vite 7, but its
  # opt-in development-only integration works with Vite 8. The pattern is
  # limited to Vite 8 and this package, so future Vite majors stay visible.
  - pattern: "vite is listed by your project with version 8.*vite-plugin-terminal*"
    level: discard
  # @streamlit/lib intentionally publishes React and ReactDOM as peers, with
  # concrete versions supplied by the root/app consumer. Adding them as lib
  # dev dependencies makes Yarn omit runtime packages from generated NOTICES.
  # These patterns match only the raw workspace warning; virtualized consumer
  # warnings and missing peers from other workspaces stay visible.
  - pattern: "@streamlit/lib@workspace:lib doesn't provide react (*"
    level: discard
  - pattern: "@streamlit/lib@workspace:lib doesn't provide react-dom (*"
    level: discard
  # Keep Yarn's aggregate peer-dependency signals visible without treating the
  # four validated warnings above as installation failures. New detailed
  # YN0002/YN0060 warnings retain their default warning level.
  - pattern: "Some peer dependencies are incorrectly met by your project;*"
    level: info
  - pattern: "Some peer dependencies are incorrectly met by dependencies;*"
    level: info

plugins:
  - checksum: 374f735053958b77583ef7b70e56a59540d1d9c681f04b8ab7a600f4325301d2e1fb67c51d34ba75bbbc4e71f8c003fbc52b1f22d7daa30dca655f1a1bf205a1
    path: .yarn/plugins/@yarnpkg/plugin-licenses.cjs
    spec: "https://raw.githubusercontent.com/mhassan1/yarn-plugin-licenses/v0.15.0/bundles/@yarnpkg/plugin-licenses.js"
