# Load version from pyproject.toml (one directory up from recipe dir)
{% set pyproject = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set version = pyproject.get('project', {}).get('version', '0.0.0') %}


package:
  name: streamlit
  version: {{ version }}

source:
  path: ..

build:
  number: {{ environ.get('CONDA_BUILD_NUMBER', 0)|int }}
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - streamlit = streamlit.web.cli:main
  script_env:
   - GIT_HASH
   - SNOWPARK_CONDA_BUILD

requirements:
  host:
    - pip
    - setuptools >=65.5.1
    - python >=3.10,<3.15
  run:
    - python >=3.10,<3.15
    # Core dependencies - keep in sync with lib/pyproject.toml [project.dependencies]
    # NOTE: The SNOWPARK_CONDA_BUILD build excludes gitpython, pydeck, and tornado.
    # These are handled by the Snowpark build process separately.
    - altair >=4.0,<7,!=5.4.0,!=5.4.1
    - blinker >=1.5.0,<2
    - cachetools >=5.5,<7
    - click >=7.0,<9
    {% if not environ.get('SNOWPARK_CONDA_BUILD') %}
    - gitpython >=3.0.7,<4,!=3.1.19
    {% endif %}
    - numpy >=1.23,<3
    - packaging >=20
    - pandas >=1.4.0,<3
    - pillow >=7.1.0,<13
    {% if not environ.get('SNOWPARK_CONDA_BUILD') %}
    - pydeck >=0.8.0b4,<1
    {% endif %}
    - protobuf >=3.20,<7
    - pyarrow >=7.0
    - requests >=2.27,<3
    - tenacity >=8.1.0,<10
    - toml >=0.10.1,<2
    {% if not environ.get('SNOWPARK_CONDA_BUILD') %}
    - tornado >=6.0.3,<7,!=6.5.0
    {% endif %}
    - typing-extensions >=4.10.0,<5
    # Conda doesn't support the `platform_system` conditional that pip does.
    # We exclude watchdog from all conda builds since it can fail without xcode on MacOS.
    # - watchdog >=2.1.5,<7

test:
  imports:
    - streamlit
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://streamlit.io
  summary: A faster way to build and share data apps
  license: Apache-2.0
  license_file: LICENSE
