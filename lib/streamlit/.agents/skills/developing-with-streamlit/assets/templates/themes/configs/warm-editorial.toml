# Warm editorial dual light/dark Streamlit theme
# Serif headings (Fraunces) on paper-toned backgrounds, soft cards, and pill
# buttons; the settings appearance toggle stays available.
# Categorical palettes were checked for color-vision deficiencies in both modes
# (adjacent pairs; the first three slots also pass all pairs, for scatter charts).

[theme]
font = "'Instrument Sans':https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap"
headingFont = "'Fraunces':https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["34px", "22px", "17px", "15px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 600
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

