# BI dashboard dual light/dark Streamlit theme
# Indigo primary, Geist fonts, compact bold metric values, and tight padding for
# KPI and card layouts; the settings appearance toggle stays available.
# Categorical palettes were checked for color-vision deficiencies in both modes
# (adjacent pairs; the first three slots also pass all pairs, for scatter charts).

[theme]
font = "'Geist':https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
headingFont = "'Geist':https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [650, 600, 600, 600, 500, 500]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 650
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#5B5BD6"
backgroundColor = "#FFFFFF"
